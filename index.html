<title>Giáo Xứ An Vân</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Literata:ital,opsz,wght@1,7..72,500;1,7..72,600&display=swap">
<style>
:root{
  /* Layout: full-bleed WebGL stage; a lacquer-and-gold HUD floats on the edges (brand top-left, clock top-right, dock bottom, info card right). Deliberately single dark look. */
  --lacquer:#16100c;
  --panel:rgba(24,17,12,.74);
  --panel-solid:#211812;
  --lime:#f4efe4;
  --lime-dim:rgba(244,239,228,.64);
  --gold:#d3a955;
  --gold-dim:rgba(211,169,85,.34);
  --vermilion:#b23a29;
  --azure:#a9c0da;
  --display:"Literata","Iowan Old Style",Georgia,serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--lacquer);color:var(--lime);font-family:var(--body);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(12,7,4,.45) 100%)}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--gold-dim);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;padding:10px 18px 10px 12px;border-radius:12px;max-width:calc(100vw - 180px)}
.brand svg{flex:none;width:30px;height:38px}
.brand h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:21px;margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:3px 0 0;font-size:11px;color:var(--lime-dim);letter-spacing:.08em;text-transform:uppercase}
.clock{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));padding:9px 14px;border-radius:12px;text-align:right;min-width:92px}
.clock .t{font-family:var(--display);font-style:italic;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.clock .l{margin-top:4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;align-items:stretch;padding:6px;border-radius:16px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;align-items:center;padding:0 4px;flex:none}
.grp+.grp{border-left:1px solid rgba(211,169,85,.22);padding-left:8px}
.btn{appearance:none;border:0;background:transparent;color:var(--lime);font:500 12px/1 var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 9px;border-radius:10px;cursor:pointer;white-space:nowrap;min-width:60px;transition:background .2s,color .2s}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:rgba(244,239,228,.09)}
.btn[aria-pressed="true"]{background:var(--vermilion);color:#fff4dc}
.btn:focus-visible,.cta:focus-visible,.ghost:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.views .btn{min-width:0;padding:8px 9px}
.views .btn span.k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.views .btn[aria-pressed="true"] span.k{color:#ffe2a8}
.time{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:4px 10px;min-width:160px}
.time label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-dim);display:flex;justify-content:space-between;gap:12px}
.time label span:last-child{color:var(--lime);font-variant-numeric:tabular-nums}
.time input{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,#1b2340 0%,#1b2340 18%,#e59a62 26%,#9fc4e8 40%,#bcd8f2 55%,#f0a564 76%,#3a2a4a 84%,#1b2340 100%);cursor:pointer}
.time input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lime);border:3px solid var(--vermilion);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.time input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--lime);border:3px solid var(--vermilion)}
.info{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:300px;padding:18px 18px 16px;border-radius:14px;max-height:calc(100vh - 220px);overflow:auto}
.info .kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.info h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:27px;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.info p{font-size:13.5px;line-height:1.62;color:rgba(244,239,228,.86);margin:0 0 16px}
.info .row{display:flex;gap:8px;flex-wrap:wrap}
.cta{background:var(--vermilion);color:#fff4dc;border:0;border-radius:9px;padding:9px 14px;font:600 12.5px var(--body);cursor:pointer}
.cta:hover{filter:brightness(1.1)}
.ghost{background:transparent;color:var(--lime);border:1px solid var(--gold-dim);border-radius:9px;padding:9px 14px;font:500 12.5px var(--body);cursor:pointer}
.tip{position:fixed;left:0;top:0;pointer-events:none;padding:6px 10px;background:var(--panel-solid);border:1px solid var(--gold-dim);border-radius:8px;font-size:12px;white-space:nowrap;z-index:5}
.tip b{font-weight:600;color:var(--gold);margin-right:6px}
.cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,246,224,.9);box-shadow:0 0 0 2px rgba(0,0,0,.3);pointer-events:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--lime);white-space:nowrap;transition:opacity .8s;pointer-events:none}
.hint kbd{font:600 11px var(--body);border:1px solid var(--gold-dim);border-radius:5px;padding:1px 5px;margin:0 2px;color:var(--gold)}
.joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--gold-dim);background:rgba(24,17,12,.35);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(244,239,228,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--lacquer);z-index:20;transition:opacity .9s}
.loader div{text-align:center}
.loader h2{font-family:var(--display);font-style:italic;font-weight:500;font-size:30px;margin:14px 0 8px}
.loader p{color:var(--lime-dim);font-size:13px;margin:0}
.bar{width:160px;height:2px;margin:18px auto 0;background:rgba(244,239,228,.12);overflow:hidden;border-radius:2px}
.bar i{display:block;width:40%;height:100%;background:var(--gold);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.loader.done{opacity:0;pointer-events:none}
@media (max-width:760px){
  .brand{padding:8px 12px 8px 10px}
  .brand h1{font-size:16px}
  .brand p{display:none}
  .brand svg{width:22px;height:28px}
  .clock .t{font-size:20px}
  .dock{left:16px;right:16px;transform:none;max-width:none}
  .info{left:16px;right:16px;top:auto;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:none;width:auto;max-height:45vh}
  .hint{bottom:calc(100px + env(safe-area-inset-bottom,0px));font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="stage"></div>
<div class="vignette"></div>

<header class="brand panel">
  <svg viewBox="0 0 30 38" aria-hidden="true"><path d="M15 1v36M7 9h16" stroke="#d3a955" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M3 37V22l12-9 12 9v15" stroke="#f4efe4" stroke-width="1.4" fill="none" stroke-linejoin="round" opacity=".7"/></svg>
  <div>
    <h1>Giáo Xứ An Vân</h1>

<div class="clock panel" aria-live="polite"><div class="t" id="clockT">10:15</div><div class="l" id="clockL">Buổi sáng</div></div>

      <svg id="icoNight" viewBox="0 0 24 24" hidden><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>

    </button>
    <button class="btn" id="bLan" type="button" aria-pressed="false" title="Đèn lồng lụa">
      <svg viewBox="0 0 24 24"><path d="M12 2v2.5M9 4.5h6M8.5 19.5h7M12 19.5V22"/><ellipse cx="12" cy="12" rx="6" ry="7.2"/><path d="M12 4.8v14.4M9 5.5c-1.6 4-1.6 9 0 13M15 5.5c1.6 4 1.6 9 0 13"/></svg>
      <span>Đèn lồng</span>
    </button>
    <button class="btn" id="bOil" type="button" aria-pressed="false" title="Đèn dầu">
      <svg viewBox="0 0 24 24"><path d="M9.5 3h5l-.6 3.5c1.6 1 2.3 2.4 2.3 4.2 0 1.6-.8 2.7-1.7 3.3H9.5c-.9-.6-1.7-1.7-1.7-3.3 0-1.8.7-3.2 2.3-4.2z"/><path d="M12 8.6c-.9 1-1 2.1 0 3 1-.9.9-2 0-3z"/><path d="M8 14h8l1.5 3.5c.4 1-.2 2-1.3 2H7.8c-1.1 0-1.7-1-1.3-2z"/></svg>
      <span>Đèn dầu</span>

  </div>
  <div class="grp time">
    <label for="tRange"><span>Giờ trong ngày</span><span id="tVal">10:15</span></label>
    <input type="range" id="tRange" min="0" max="24" step="0.05" value="10.25">

  <div class="grp views" id="views">
    <button class="btn" type="button" data-view="aerial" aria-pressed="true"><span class="k">Flycam</span>Toàn cảnh</button>
    <button class="btn" type="button" data-view="front" aria-pressed="false"><span class="k">Sân</span>Mặt tiền</button>
    <button class="btn" type="button" data-view="inside" aria-pressed="false"><span class="k">Gian</span>Bên trong</button>

  </div>
  <div class="grp">
    <button class="btn" id="bTour" type="button" aria-pressed="false" title="Camera bay quanh">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="9" ry="4.5"/><path d="M12 4v6M9.5 6.5 12 4l2.5 2.5"/><circle cx="21" cy="13" r="1.2" fill="currentColor"/></svg>

      <svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>

    </button>
  </div>
</nav>

<div class="loader" id="loader"><div>
  <svg viewBox="0 0 30 38" width="34" height="44" aria-hidden="true"><path d="M15 1v36M7 9h16" stroke="#d3a955" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
  <h2>Giáo Xứ An Vân</h2>
  <p id="loadMsg">Đang dựng mái ngói, cột gỗ và vườn cau…</p>
  <div class="bar"><i></i></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Reflector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('loadMsg').textContent='Không tải được thư viện Three.js. Kiểm tra kết nối mạng rồi tải lại trang.';return;}
const V3=THREE.Vector3, PI=Math.PI;
const isTouch=matchMedia('(pointer: coarse)').matches;
const $=id=>document.getElementById(id);
addEventListener('error',e=>{const m=$('loadMsg');if(m&&!$('loader').classList.contains('done'))m.textContent='Không dựng được cảnh: '+e.message;});

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(1987);
const R=(a,b)=>a+(b-a)*rand();
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s;}
function terrainH(x,z){const r=Math.hypot(x,z);const f=smooth(52,95,r);return f*(fbm(x*.025+3,z*.025)*9+(r-52)*.08)+ (1-f)*0;}

/* ---------- renderer / scene ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){$('loadMsg').textContent='Trình duyệt này chưa bật WebGL nên không hiển thị được cảnh 3D.';return;}
let quality=isTouch?'low':'high';
renderer.setPixelRatio(Math.min(devicePixelRatio,quality==='high'?2:1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.62;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xb9cdd0,.0055);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,3000);
camera.position.set(0,36,46);

/* ---------- canvas textures ---------- */
function canvasTex(w,h,draw,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=o.clamp?THREE.ClampToEdgeWrapping:THREE.RepeatWrapping;if(o.srgb!==false)t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;if(o.rep)t.repeat.set(o.rep[0],o.rep[1]);return t;}
function speckle(g,w,h,n,cols,s0,s1){for(let i=0;i<n;i++){g.fillStyle=cols[(rand()*cols.length)|0];const s=R(s0,s1);g.fillRect(rand()*w,rand()*h,s,s);}}
const rgb=(c,k)=>`rgb(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0})`;

const T={};
T.plaster=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#f2f0e9';g.fillRect(0,0,w,h);g.globalAlpha=.06;speckle(g,w,h,3000,['#8f8a7e','#ffffff','#c8c0ad'],1,3);g.globalAlpha=.035;for(let i=0;i<10;i++){g.fillStyle='#6e675a';g.fillRect(rand()*w,0,R(4,20),h);}g.globalAlpha=1;},{rep:[.5,.5]});
function drawRoof(g,w,h,bump){const rows=8,cols=10,th=h/rows,tw=w/cols;g.fillStyle=bump?'#000':'#5e2414';g.fillRect(0,0,w,h);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=c*tw,y=r*th;const base=bump?[128,128,128]:[R(150,188),R(60,84),R(36,52)];const k=bump?[.25,1,.25]:[.58,1.1,.56];
    const gr=g.createLinearGradient(x,0,x+tw,0);gr.addColorStop(0,rgb(base,k[0]));gr.addColorStop(.5,rgb(base,k[1]));gr.addColorStop(1,rgb(base,k[2]));g.fillStyle=gr;g.fillRect(x+1,y,tw-2,th-1);
    const sg=g.createLinearGradient(0,y+th-9,0,y+th);sg.addColorStop(0,'rgba(0,0,0,0)');sg.addColorStop(1,bump?'rgba(0,0,0,.8)':'rgba(20,6,2,.55)');g.fillStyle=sg;g.fillRect(x,y+th-9,tw,9);}
  if(!bump){g.globalAlpha=.16;speckle(g,w,h,1400,['#2e2a1f','#4c5a34','#e0a882','#1d1a14'],1,3);g.globalAlpha=1;}}
T.roof=canvasTex(512,512,(g,w,h)=>drawRoof(g,w,h,false),{rep:[.5,.5]});

function add(geo,m,x=0,y=0,z=0,parent=scene,o={}){const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);me.castShadow=o.cast!==false;me.receiveShadow=o.receive!==false;parent.add(me);return me;}
function mBox(w,h,d){const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;const dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*dm[f][0],uv.getY(k)*dm[f][1]);}return g;}
function quadGeo(a,b,c,d,uL,vL){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a.toArray(),...b.toArray(),...c.toArray(),...d.toArray()],3));g.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,uL,0,uL,vL,0,vL],2));g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();return g;}
function normUV(g){g.computeBoundingBox();const b=g.boundingBox,uv=g.attributes.uv,p=g.attributes.position;for(let i=0;i<uv.count;i++)uv.setXY(i,(p.getX(i)-b.min.x)/(b.max.x-b.min.x),(p.getY(i)-b.min.y)/(b.max.y-b.min.y));return g;}
function extrude(pts,depthV,m,parent,z=0,y=0){const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));return add(new THREE.ExtrudeGeometry(s,{depth:depthV,bevelEnabled:false}),m,0,y,z,parent);}
function lancetShape(w,h){const s=new THREE.Shape(),r=w/2,sh=h-w*.8;s.moveTo(-r,0);s.lineTo(r,0);s.lineTo(r,sh);s.quadraticCurveTo(r,sh+w*.55,0,h);s.quadraticCurveTo(-r,sh+w*.55,-r,sh);s.closePath();return s;}

/* gable roof: ridge along z, eave line at y=0 on the wall plane (x = ±span/2) */
function gableRoof({span,length,rise,over=.8,top=mat.roof,under=mat.under,fascia=mat.wood}){
  const g=new THREE.Group();const hw=span/2,hs=hw+over,dy=rise*over/hw,L=length/2,slope=Math.hypot(hs,rise+dy);

    const a=new V3(s*hs,-dy,L),b=new V3(s*hs,-dy,-L),c=new V3(0,rise,-L),d=new V3(0,rise,L);

    const o=new V3(0,-.16,0);add(quadGeo(a.clone().add(o),b.clone().add(o),c.clone().add(o),d.clone().add(o),length,slope),under,0,0,0,g,{cast:false});

  const ridge=add(new THREE.CylinderGeometry(.15,.15,length+.25,10),mat.ridge,0,rise+.02,0,g);ridge.rotation.x=PI/2;
  return g;
}

function isBlocked(x,z,pad=0){
  if(Math.abs(x)<11.6+pad&&z>-27.5-pad&&z<13.6+pad)return true;
  if(Math.abs(x)<5.6+pad&&z<35+pad&&z>12)return true;
  if(Math.pow((x-24)/(8.6+pad),2)+Math.pow((z-14)/(6.6+pad),2)<1)return true;
  if(x>SH.x-4.5-pad&&x<SH.x+7.2+pad&&z>SH.z-6-pad&&z<SH.z+6+pad)return true;
  if(x>16-pad&&x<32+pad&&z>-18.5-pad&&z<-7.5+pad)return true;
  if(x>-10-pad&&x<2+pad&&z>-44-pad&&z<-36+pad)return true;
  for(const b of blocked)if(Math.hypot(x-b[0],z-b[1])<b[2]+pad)return true;
  return false;}

$('bTour').addEventListener('click',()=>setTour(!state.tour));
$('bWalk').addEventListener('click',()=>{fp.on?exitFP():enterFP();});
function setQuality(q){quality=q;renderer.setPixelRatio(Math.min(devicePixelRatio,q==='high'?2:1.25));const s=q==='high'?2048:1024;sun.shadow.mapSize.set(s,s);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}if(window.__tufts)window.__tufts.visible=q==='high'||!isTouch;$('bQL').textContent=q==='high'?'Cao':'Nhẹ';$('bQ').setAttribute('aria-pressed',String(q!=='high'));}
$('bQ').addEventListener('click',()=>setQuality(quality==='high'?'low':'high'));
let hintTimer=null;function showHint(html){const h=$('hint');h.innerHTML=html;h.style.opacity=1;clearTimeout(hintTimer);hintTimer=setTimeout(()=>{h.style.opacity=0;},7000);}
showHint('Kéo để xoay · cuộn để thu phóng · bấm vào vật thể để tương tác');

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- freeze static transforms ---------- */
scene.updateMatrixWorld(true);
const keepAnim=new Set();dynamic.forEach(o=>{let p=o;while(p){keepAnim.add(p);p=p.parent;}});
scene.traverse(o=>{if(!keepAnim.has(o)&&!dynamic.has(o)){o.matrixAutoUpdate=false;}});
dynamic.forEach(o=>{o.traverse(c=>{c.matrixAutoUpdate=true;});});

/* ======================================================================
   LOOP
   ====================================================================== */
setQuality(quality);
applyTime(state.hour);$('tRange').value=state.hour;
const clock=new THREE.Clock();let frame=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime,now=performance.now();
  if(hourAnim){const k=Math.min(1,(now-hourAnim.s)/hourAnim.d);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;state.hour=lerp(hourAnim.from,hourAnim.to,e)%24;$('tRange').value=state.hour;if(k>=1)hourAnim=null;}
  if(state.hour!==applyTime.last){applyTime(state.hour);applyTime.last=state.hour;}
  // lights fade
  lv.lan+=((state.lanterns?1:0)-lv.lan)*Math.min(1,dt*3);lv.oil+=((state.oil?1:0)-lv.oil)*Math.min(1,dt*3);lv.cand+=((state.candles?1:0)-lv.cand)*Math.min(1,dt*2);
  const flick=.9+.1*Math.sin(t*11)*Math.sin(t*7.3);
  mat.silk.emissiveIntensity=lv.lan*(1.2+1.6*nightF);glowMat.opacity=lv.lan*(.25+.75*nightF)*flick;
  lanternLights.forEach((l,i)=>{l.intensity=lv.lan*(1.2+2.2*nightF)*(.93+.07*Math.sin(t*9+i));});
  oilGlowMat.opacity=lv.oil*(.3+.7*nightF);
  for(const f of flames){const s=lv.oil>.02?1:0;const w=.85+.25*Math.sin(t*14+f.ph)*Math.sin(t*9.1+f.ph*2);f.f.visible=lv.oil>.05;f.f.scale.set(w,2.2*w,w);f.sp.scale.setScalar(.75*w);}
  oilLight.intensity=lv.oil*(.8+1.6*nightF)*(.85+.15*Math.sin(t*13));
  const interior=.35+lv.cand*1.6;interiorLight.intensity=interior*(.6+.6*nightF);interiorLight2.intensity=(.2+lv.cand*1.4)*(.95+.05*Math.sin(t*8));
  mat.glass.emissiveIntensity=nightF*(.1+lv.cand*1.2)+ .02;
  mat.bulb.emissiveIntensity=.5+lv.cand*2.4+nightF*.6;naveGlow.opacity=(.12+lv.cand*.55)*(.55+.45*nightF);
  // wind
  gust=Math.max(0,gust-dt*.35);wind=1+gust;
  for(const s of swayers){s.shake=Math.max(0,s.shake-dt*.5);const a=s.amp*wind+s.shake*.12*Math.sin(t*9);s.o.rotation.x=Math.sin(t*1.1+s.ph)*a;s.o.rotation.z=Math.cos(t*.9+s.ph*1.3)*a;}
  for(const u of updaters)u(t,dt);
  // camera
  if(tween){const k=Math.min(1,(now-tween.s)/tween.d);const e=1-Math.pow(1-k,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(k>=1)tween=null;}
  if(fp.on)updateFP(dt);else controls.update();
  renderer.render(scene,camera);
  if(++frame===2)$('loader').classList.add('done');
}
loop();
})();
</script>
